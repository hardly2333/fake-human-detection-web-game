<style>

.member-number {

}

.slider-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  cursor: ew-resize;
  border: 2px solid #c4b898;
  border-radius: 2px;
  user-select: none;
  -webkit-user-select: none;
  margin-bottom: 8px;
  background: #3b2e1e;
}

.slider-before,
.slider-after {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.slider-before img,
.slider-after img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.slider-after {
  clip-path: inset(0 0 0 50%);
}

.slider-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 44px;
  transform: translateX(-50%);
  cursor: ew-resize;
  z-index: 2;
  background: transparent;
}

.slider-handle::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  background: #d4843a;
  box-shadow: 0 0 6px rgba(0,0,0,0.4);
}

.slider-handle::after {
  content: '⟷';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 36px;
  height: 36px;
  background: #d4843a;
  border: 2px solid #f5ecd7;
  border-radius: 50%;
  box-shadow: 0 1px 6px rgba(0,0,0,0.5);
  color: #f5ecd7;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.slider-label {
  position: absolute;
  bottom: 6px;
  font-size: clamp(0.6rem, 1.8vw, 0.7rem);
  color: #f5ecd7;
  background: rgba(0,0,0,0.55);
  padding: 2px 8px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 1;
}

.slider-label-before {
  left: 6px;
}

.slider-label-after {
  right: 6px;
}

.member-status {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 3;
  padding: 4px 9px;
  color: #fff6e8;
  background: #9f3215;
  border: 1px solid #f0b05b;
  border-radius: 2px;
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.06em;

  transform: translateY(-4px);
  transition: opacity 0.18s ease, transform 0.18s ease;
  pointer-events: none;
}

.member-card.selected .member-status {

  transform: translateY(0);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 6px 10px;
  border: 1px solid transparent;
  border-radius: 3px;

.member-card.selected .checkbox-row {

.checkbox-row input[type="checkbox"] {

.checkbox-label {

}

.sticky-submit {

  left: 50%;
  bottom: 0;
  z-index: 900;
  width: min(100%, 480px);
  transform: translateX(-50%);

.selection-status {

.selection-status strong {

.btn-submit {

.modal-content {

.modal-score {

.modal-score .score-num {

.result-section {

.knowledge-item {

.modal-footer {

.btn-close,
.btn-retry {

}

.toast.show {
  display: block;
  animation: toastIn 0.3s ease;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }

<body>

<div class="header">
  <h1>谁是伪人？</h1>
</div>

<div class="story">
  探险队野外任务归来，营地门卫须在"例行检测"中找出伪装成人类的"伪人"。伪人外表与常人无异，却无法正确使用椅子——它们的坐姿和椅子会出现违背人体工学原理的怪异现象。根据人体工学知识判断：合格坐姿者放行，异常者隔离。拖动滑块对比每位队员的"档案照"与"实拍"，找出伪人。
</div>

<div class="rules">
  <strong>游戏规则：</strong>左侧「档案照」为出征前留档，右侧「实拍」为归来后影像。拖动滑块对比同一人的坐姿与椅子状态，发现异常者勾选「标记为伪人」并提交。误判真人会影响你的门卫考评。
</div>

<div class="members-section">
  <h2>逐个审查</h2>
  <div id="memberList"></div>
</div>

<div class="sticky-submit">
  <div class="selection-status" id="selectionStatus" aria-live="polite">
    已标记
    <strong><span id="selectedCount">0</span> / 8</strong>
  </div>
  <button class="btn-submit" id="btnSubmit">提交检测结果</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>检测报告</h2>
    </div>
    <div class="modal-body">
      <div class="modal-score">
        <span class="score-num" id="scoreNum">抓获 0 / 4</span>
        <p class="score-text" id="scoreText">漏判 0 人 · 误判 0 人</p>
      </div>
      <div class="modal-ending" id="modalEnding"></div>
      <div class="modal-rank" id="modalRank"></div>
      <div class="result-section correct" id="sectionCorrect"></div>
      <div class="result-section missed" id="sectionMissed"></div>
      <div class="result-section wrong" id="sectionWrong"></div>
      <div class="knowledge-section" id="sectionKnowledge"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-close" id="btnClose">关闭</button>
      <button class="btn-retry" id="btnRetry">重新检测</button>
    </div>
  </div>
</div>

<script>
const MEMBERS = [
  { id: 1, name: '老马',  desc: '40岁 · 络腮胡 · 探险帽',       isFake: false, explain: '表情疲倦，坐姿正确，无异常' },
  { id: 2, name: '阿布',  desc: '30岁 · 光头 · 强壮 · 战术背心',  isFake: true,  feature: '椅子垫高20cm，双脚悬空，扶手过高', knowledge: '膝关节应自然弯曲约90°，双脚平稳触地，悬空会压迫大腿神经。扶手过高导致耸肩，手臂无法自然平放，肘关节难以维持90°自然夹角。' },
  { id: 3, name: '叶林',  desc: '28岁 · 圆框眼镜 · 短辫',        isFake: false, explain: '表情紧张，坐姿正确，无异常' },
  { id: 4, name: '铁锤',  desc: '35岁 · 矮胖 · 工装手套',        isFake: true,  feature: '网布坐垫塌陷大洞，椅腿扭曲', knowledge: '劣质网布易塌陷，大体重人群建议选高密度海绵或高弹力网布坐垫。气压棒须认准SGS/TUV/BIFMA认证，级别在Class 3或以上。' },
  { id: 5, name: '小昭',  desc: '24岁 · 瘦小 · 红色冲锋衣',       isFake: false, explain: '表情疲倦，坐姿正确，无异常' },
  { id: 6, name: '大魁',  desc: '32岁 · 高瘦 · 黄发',            isFake: true,  feature: '椅背断裂后倒，气压棒裂纹', knowledge: '靠背支撑腰部，断裂导致腰椎悬空无支撑。气压棒关乎安全，裂纹极危险，须认准Class 3/4认证。' },
  { id: 7, name: '阿强',  desc: '26岁 · 短发 · 左臂纹身',         isFake: false, explain: '表情害怕，坐姿正确，无异常' },
  { id: 8, name: '老周',  desc: '50岁 · 白发 · 戴护腰',          isFake: true,  feature: '触手扶手，头枕反装，脖子后仰', knowledge: '扶手高度应让双肩自然下沉，肘关节约90°。头枕反装导致仰头，显示器顶端应与视线平行，避免长时间仰头造成颈椎负担。' }
];

const FAKE_IDS = [2, 4, 6, 8];
const COUNTER_URL = 'https://6657-upup.hardly2333.workers.dev/completions';
const STORAGE_KEY = 'webgame_fh_submitted';

let submittedBefore = false;
let firstRank = null;
let submitting = false;

function buildMemberCards() {
  const container = document.getElementById('memberList');
  MEMBERS.forEach(m => {
    const card = document.createElement('div');
    card.className = 'member-card';
    card.innerHTML =
      `<div class="member-header">
        <span class="member-number">${m.id}</span>
        <span class="member-name">${m.name}</span>
        <span class="member-desc">${m.desc}</span>
      </div>
      <div class="slider-container" data-member="${m.id}">
        <div class="slider-before">
          <img src="figs/${m.id}_before.webp" alt="${m.name} 档案照" draggable="false">
        </div>
        <div class="slider-after">
          <img src="figs/${m.id}_after.webp" alt="${m.name} 实拍" draggable="false">
        </div>
        <div class="slider-handle"></div>
        <span class="slider-label slider-label-before">档案照</span>
        <span class="slider-label slider-label-after">实拍</span>
        <span class="member-status" aria-hidden="true">已隔离</span>
      </div>
      <label class="checkbox-row" for="chk-${m.id}">
        <input type="checkbox" id="chk-${m.id}" value="${m.id}">
        <span class="checkbox-label">标记为伪人</span>
      </label>`;
    container.appendChild(card);
  });

  container.addEventListener('change', (e) => {
    if (e.target.matches('input[type="checkbox"]')) {
      syncSelectionState();
    }
  });
}

function initSliders() {
  document.querySelectorAll('.slider-container').forEach(container => {
    const after = container.querySelector('.slider-after');
    const handle = container.querySelector('.slider-handle');
    let dragging = false;
    let position = 50;

    function updatePosition(clientX) {
      const rect = container.getBoundingClientRect();
      const x = clientX - rect.left;
      position = Math.max(0, Math.min(100, (x / rect.width) * 100));
      after.style.clipPath = `inset(0 0 0 ${position}%)`;
      handle.style.left = position + '%';
    }

    function setInitialPosition() {
      after.style.clipPath = 'inset(0 0 0 50%)';
      handle.style.left = '50%';
    }

    function onStart(e) {
      e.preventDefault();
      dragging = true;
      container.style.cursor = 'ew-resize';
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      updatePosition(clientX);
    }

    function onMove(e) {
      if (!dragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      updatePosition(clientX);
    }

    function onEnd() {
      dragging = false;
    }

    function onClick(e) {
      if (e.target === handle || e.target.closest('.slider-handle')) return;
      updatePosition(e.clientX);
    }

    setInitialPosition();

    handle.addEventListener('mousedown', onStart);
    handle.addEventListener('touchstart', onStart, { passive: false });
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);
    container.addEventListener('click', onClick);
  });
}

function showToast(msg, duration) {
  duration = duration || 2000;
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), duration);
}

function getCheckedIds() {
  const checked = [];
  MEMBERS.forEach(m => {
    const cb = document.getElementById('chk-' + m.id);
    if (cb && cb.checked) checked.push(m.id);
  });
  return checked;
}

function syncSelectionState() {
  let checkedCount = 0;

  MEMBERS.forEach(m => {
    const cb = document.getElementById('chk-' + m.id);
    if (!cb) return;

    const card = cb.closest('.member-card');
    card.classList.toggle('selected', cb.checked);
    if (cb.checked) checkedCount += 1;
  });

  document.getElementById('selectedCount').textContent = checkedCount;
}

function getEndingTitle(checkedIds, correctChecked, wrongChecked) {
  if (checkedIds.length === 8) {
    return {
      title: '宁可错杀一千',
      text: '你把所有人都当成了伪人。四个真伪人确实落网了，但四名无辜队员也被你隔离——营地现在人手紧缺，今晚的岗哨排班得重新安排了。'
    };
  }
  if (wrongChecked.length >= 2 && correctChecked.length === 0) {
    return {
      title: '敌我不分',
      text: '真正的队员全被你当成了威胁，伪人却大摇大摆进了安全区。门卫同志，你到底是来帮哪边的？'
    };
  }
  if (checkedIds.length === 1 && correctChecked.length === 0) {
    return {
      title: '敷衍了事',
      text: '你就随便勾了一个交差是吧。伪人已经混入营地，而你这个门卫的态度比伪人更让人担心。'
    };
  }
  if (wrongChecked.length > 0) {
    const missedCount = FAKE_IDS.length - correctChecked.length;
    if (missedCount === 0) {
      return {
        title: '有功有过',
        text: '四个伪人全部落网，但你也误判了 ' + wrongChecked.length + ' 名真正队员。威胁已经解除，门卫考评仍会记上一笔。'
      };
    }
    return {
      title: '真假难辨',
      text: '你抓获了 ' + correctChecked.length + ' 名伪人，但漏判 ' + missedCount + ' 名、误判 ' + wrongChecked.length + ' 名真正队员。判断还需要更谨慎。'
    };
  }

  const score = correctChecked.length;
  const endings = {
    0: { title: '有眼无珠', text: '你一个伪人都没认出来。四个异质混入了安全区，今晚营地恐怕不会太平了。' },
    1: { title: '初窥门径', text: '你只揪出了一个伪人，剩下三个已经混进了队员队伍。营地暂时安全，但隐患未除。' },
    2: { title: '半信半疑', text: '你识别了一半的威胁，还有漏网之鱼潜伏在队伍中。加油，你对椅子的观察力还有进步空间。' },
    3: { title: '火眼金睛', text: '几乎全对！只有一个漏网之鱼溜进了安全区。你的检测能力值得信赖，队员们可以安心休整了。' },
    4: { title: '明察秋毫', text: '四个伪人全部伏法，安全区固若金汤。营地今晚为你加餐——你是当之无愧的首席检测员。' }
  };
  return endings[score];
}

function buildResult(checkedIds) {
  const correctChecked = checkedIds.filter(id => FAKE_IDS.includes(id));
  const missed = FAKE_IDS.filter(id => !checkedIds.includes(id));
  const wrongChecked = checkedIds.filter(id => !FAKE_IDS.includes(id));

  const score = correctChecked.length;

  document.getElementById('scoreNum').textContent = '抓获 ' + score + ' / 4';
  document.getElementById('scoreText').textContent =
    '漏判 ' + missed.length + ' 人 · 误判 ' + wrongChecked.length + ' 人';

  const ending = getEndingTitle(checkedIds, correctChecked, wrongChecked);
  document.getElementById('modalEnding').innerHTML =
    '<div class="ending-title">🏆「' + ending.title + '」</div>' +
    '<div class="ending-text">' + ending.text + '</div>';

  const sectionCorrect = document.getElementById('sectionCorrect');
  const sectionMissed = document.getElementById('sectionMissed');
  const sectionWrong = document.getElementById('sectionWrong');
  const sectionKnowledge = document.getElementById('sectionKnowledge');

  if (correctChecked.length > 0) {
    const names = correctChecked.map(id => MEMBERS.find(m => m.id === id).name).join('、');
    sectionCorrect.innerHTML = '<h3>✅ 正确标记</h3><ul class="result-list"><li>' + names + '</li></ul>';
    sectionCorrect.style.display = '';
  } else {
    sectionCorrect.style.display = 'none';
  }

  if (missed.length > 0) {
    const names = missed.map(id => MEMBERS.find(m => m.id === id).name).join('、');
    sectionMissed.innerHTML = '<h3>❌ 漏判（未识别的伪人）</h3><ul class="result-list"><li>' + names + '</li></ul>';
    sectionMissed.style.display = '';
  } else {
    sectionMissed.style.display = 'none';
  }

  if (wrongChecked.length > 0) {
    const items = wrongChecked.map(id => {
      const m = MEMBERS.find(m => m.id === id);
      return '<li>' + m.name + '：' + m.explain + '</li>';
    }).join('');
    sectionWrong.innerHTML = '<h3>⚠️ 误判（错把真人当伪人）</h3><ul class="result-list">' + items + '</ul>';
    sectionWrong.style.display = '';
  } else {
    sectionWrong.style.display = 'none';
  }

  const knowledgeItems = correctChecked.map(id => {
    const m = MEMBERS.find(m => m.id === id);
    return `<div class="knowledge-item">
      <div class="ki-name">🪑 ${m.name}</div>
      <div class="ki-feature">异常：${m.feature}</div>
      <div class="ki-detail">${m.knowledge}</div>
    </div>`;
  }).join('');

  if (knowledgeItems) {
    sectionKnowledge.innerHTML = '<h3>人体工学知识点</h3>' + knowledgeItems;
    sectionKnowledge.style.display = '';
  } else {
    sectionKnowledge.style.display = 'none';
  }
}

async function fetchRank() {
  if (submittedBefore && firstRank !== null) {
    return firstRank;
  }

  if (submittedBefore) return null;

  try {
    const resp = await fetch(COUNTER_URL);
    if (!resp.ok) throw new Error('Counter error');
    const data = await resp.json();
    firstRank = data.value;
    return data.value;
  } catch (e) {
    return null;
  }
}

function showModal() {
  document.getElementById('modalOverlay').classList.add('active');
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function resetAll() {
  MEMBERS.forEach(m => {
    const cb = document.getElementById('chk-' + m.id);
    if (cb) cb.checked = false;
  });
  document.querySelectorAll('.slider-after').forEach(after => {
    after.style.clipPath = 'inset(0 0 0 50%)';
  });
  document.querySelectorAll('.slider-handle').forEach(handle => {
    handle.style.left = '50%';
  });
  syncSelectionState();
}

document.getElementById('btnSubmit').addEventListener('click', async () => {
  if (submitting) return;
  const checkedIds = getCheckedIds();
  if (checkedIds.length === 0) {
    showToast('请至少勾选一名疑似伪人');
    return;
  }

  submitting = true;
  buildResult(checkedIds);

  const rankEl = document.getElementById('modalRank');
  rankEl.textContent = '计数加载中…';

  showModal();

  const rank = await fetchRank();
  if (rank !== null) {
    rankEl.textContent = '你是第 ' + rank + ' 位完成检测的营地门卫';
    if (!submittedBefore) {
      submittedBefore = true;
      try { localStorage.setItem(STORAGE_KEY, '1'); } catch(e) {}
    }
  } else {
    rankEl.textContent = '计数服务暂不可用';
  }

  submitting = false;
});

document.getElementById('btnClose').addEventListener('click', hideModal);
document.getElementById('btnRetry').addEventListener('click', () => {
  resetAll();
  submitting = false;
  hideModal();
});

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) hideModal();
});

if (typeof localStorage !== 'undefined') {
  if (localStorage.getItem(STORAGE_KEY)) {
    submittedBefore = true;
  }
}

buildMemberCards();
initSliders();
syncSelectionState();
</script>
