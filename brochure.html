<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>营地门卫手册 — 印刷用</title>
<style>
@page { size: A4; margin: 0; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #fff;
  font-family: Georgia, 'Times New Roman', 'SimSun', serif;
  color: #3b2e1e;
}

.page-a, .page-b {
  width: 210mm;
  height: 297mm;
  margin: 0 auto;
  padding: 12mm 12mm;
  background-color: #faf3e6;
  background-image:
    radial-gradient(ellipse at 30% 70%, rgba(139,119,90,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(180,140,90,0.04) 0%, transparent 40%);
  page-break-after: always;
  position: relative;
  overflow: hidden;
}

.page-b { page-break-after: auto; }

@media print {
  body { background: #fff; }
  .page-a, .page-b { box-shadow: none; margin: 0; }
}

/* ===== A面：海报式引导 ===== */

.poster-hook {
  text-align: center;
  padding: 10mm 4mm 6mm;
}

.poster-hook .hook-line {
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: 17mm;
  color: #6b3a1f;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.1;
  margin-bottom: 4mm;
  text-shadow: 2px 2px 0 rgba(180, 140, 90, 0.3);
}

.poster-hook .hook-sub {
  font-family: 'SimHei', 'Heiti SC', 'SimSun', serif;
  font-size: 6mm;
  color: #8b5a1a;
  letter-spacing: 0.08em;
}

.poster-steps {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 2mm 2mm 6mm;
  flex-wrap: wrap;
}

.step-item {
  text-align: center;
  width: 32mm;
}

.step-icon {
  font-size: 14mm;
  line-height: 1;
  margin-bottom: 1mm;
}

.step-label {
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: 5mm;
  color: #6b3a1f;
  letter-spacing: 0.08em;
}

.step-arrow {
  font-size: 7mm;
  color: #c4a35a;
}

.qr-section {
  text-align: center;
  padding: 6mm 0 0;
}

.qr-section img {
  width: 64mm;
  height: 64mm;
  border: 4px solid #8b775a;
  padding: 2mm;
  background: #fff;
}

.qr-section .qr-label {
  font-family: 'SimHei', 'Heiti SC', 'SimSun', serif;
  font-size: 5mm;
  color: #6b3a1f;
  letter-spacing: 0.05em;
  margin-top: 4mm;
  font-weight: bold;
}

.page-a-footer {
  text-align: center;
  border-top: 1px dashed #c4b898;
  padding-top: 3mm;
  font-size: 2.6mm;
  color: #a09070;
  position: absolute;
  bottom: 8mm;
  left: 12mm;
  right: 12mm;
}

/* ===== B面：图文坐姿指南 ===== */

.page-b-header {
  text-align: center;
  border-bottom: 2px solid #8b775a;
  padding-bottom: 5mm;
  margin-bottom: 8mm;
}

.page-b-header h1 {
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: 7mm;
  color: #6b3a1f;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.page-b-header .sub {
  font-size: 3.4mm;
  color: #8b775a;
  margin-top: 1mm;
  font-style: italic;
}

.posture-layout {
  display: flex;
  gap: 6mm;
  align-items: flex-start;
  padding: 0 2mm;
}

.posture-image {
  flex: 0 0 48%;
}

.posture-image img {
  width: 100%;
  height: auto;
  display: block;
  border: 3px solid #8b775a;
  border-radius: 3px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.posture-principles {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10mm;
  padding-top: 4mm;
}

.principle {
  display: flex;
  align-items: flex-start;
  gap: 5mm;
}

.principle-num {
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: 10mm;
  color: #c44a1a;
  line-height: 1;
  flex-shrink: 0;
  width: 16mm;
  text-align: center;
}

.principle-content strong {
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: 4.5mm;
  color: #6b3a1f;
  letter-spacing: 0.04em;
  display: block;
  margin-bottom: 1.5mm;
}

.principle-content p {
  font-size: 3.4mm;
  line-height: 1.7;
  color: #5a4a32;
}

.posture-note {
  text-align: center;
  font-size: 3.6mm;
  color: #8b775a;
  padding: 8mm 0 4mm;
  border-bottom: 1px dashed #c4b898;
  margin-bottom: 4mm;
  font-style: italic;
}

.page-b-footer {
  text-align: center;
  border-top: 1px dashed #c4b898;
  padding-top: 3mm;
  font-size: 2.6mm;
  color: #a09070;
  position: absolute;
  bottom: 8mm;
  left: 12mm;
  right: 12mm;
}
</style>
</head>
<body>

<!-- ================ A面 ================ -->
<div class="page-a">
  <div class="poster-hook">
    <p class="hook-line">它们就在队伍里</p>
    <p class="hook-sub">一张椅子就能让伪人现出原形</p>
  </div>

  <div class="poster-steps">
    <div class="step-item">
      <div class="step-icon">📷</div>
      <div class="step-label">辨认</div>
    </div>
    <div class="step-arrow">→</div>
    <div class="step-item">
      <div class="step-icon">🔄</div>
      <div class="step-label">比照</div>
    </div>
    <div class="step-arrow">→</div>
    <div class="step-item">
      <div class="step-icon">👁</div>
      <div class="step-label">辨伪</div>
    </div>
    <div class="step-arrow">→</div>
    <div class="step-item">
      <div class="step-icon">☑</div>
      <div class="step-label">标记</div>
    </div>
  </div>

  <div class="qr-section">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://hardly2333.github.io/fake-human-detection-web-game/" alt="二维码">
    <p class="qr-label">📱 扫码，亮出你的判断</p>
  </div>

  <div class="page-a-footer">
    本手册仅供营地内部使用 · 请勿外传
  </div>
</div>

<!-- ================ B面 ================ -->
<div class="page-b">
  <div class="page-b-header">
    <h1>新人检测指南</h1>
    <p class="sub">—— 人体工学椅异常识别手册 ——</p>
  </div>

  <div class="posture-layout">
    <div class="posture-image">
      <img src="figs/posture_guide.webp" alt="正确坐姿示意图">
    </div>
    <div class="posture-principles">
      <div class="principle">
        <div class="principle-num">90°</div>
        <div class="principle-content">
          <strong>躯干与大腿</strong>
          <p>臀坐最深处，腰部紧贴椅背，不前倾不下滑</p>
        </div>
      </div>
      <div class="principle">
        <div class="principle-num">90°</div>
        <div class="principle-content">
          <strong>膝关节</strong>
          <p>双脚平稳触地，大腿平行地面，不悬空不垫脚</p>
        </div>
      </div>
      <div class="principle">
        <div class="principle-num">90°</div>
        <div class="principle-content">
          <strong>肘关节</strong>
          <p>双肩自然下沉，前臂平放扶手，不耸肩不悬臂</p>
        </div>
      </div>
    </div>
  </div>

  <p class="posture-note">+ 显示器顶端与视线平行，不低头不仰头</p>

  <div class="page-b-footer">
    记住：没有任何坐姿适合保持一整天 · 每隔 45-60 分钟起来活动
  </div>
</div>

</body>
</html>
